<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>打卡 - 考勤管理系统</title>
  <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.2/css/bootstrap.min.css}">
  <style>
    .clock { font-size: 64px; font-family: monospace; font-weight: bold; margin: 20px 0; }
    .btn-checkin { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border: none; font-size: 24px; padding: 20px 40px; border-radius: 60px; transition: all 0.3s; }
    .btn-checkin:hover { transform: scale(1.05); opacity: 0.95; }
    .btn-checkout { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); border: none; font-size: 24px; padding: 20px 40px; border-radius: 60px; transition: all 0.3s; }
    .btn-checkout:hover { transform: scale(1.05); opacity: 0.95; }
    .btn-checkin.disabled, .btn-checkout.disabled { opacity: 0.5; pointer-events: none; }
    .info-card { border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    .time-info { font-size: 18px; padding: 10px; background: #f8f9fa; border-radius: 10px; }
  </style>
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
  <div class="container">
    <a class="navbar-brand" href="/attendance/dashboard">🏢 考勤管理系统</a>
    <a class="nav-link text-white" href="/attendance/dashboard">← 返回首页</a>
  </div>
</nav>

<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="text-center mb-4">
        <h2>👋 欢迎，<span th:text="${session.user.realName}"></span></h2>
      </div>

      <div class="card info-card mb-4">
        <div class="card-body text-center">
          <h5>📅 当前日期</h5>
          <div class="clock" th:text="${#dates.format(#dates.createNow(), 'yyyy年MM月dd日')}"></div>
          <h5>🕐 当前时间</h5>
          <div id="currentTime" class="clock" style="font-size: 48px;"></div>
        </div>
      </div>

      <div class="card info-card mb-4">
        <div class="card-body">
          <div class="row text-center">
            <div class="col-6">
              <div class="time-info">
                <strong>⏰ 上班时间</strong><br>
                <span class="fs-3" th:text="${workStartTime}"></span>
              </div>
            </div>
            <div class="col-6">
              <div class="time-info">
                <strong>⏰ 下班时间</strong><br>
                <span class="fs-3" th:text="${workEndTime}"></span>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
        ✅ <span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
      <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        ❌ <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>

      <div class="row text-center mt-4">
        <div class="col-6">
          <form th:action="@{/checkin}" method="post">
            <button type="submit" class="btn btn-checkin w-100" th:classappend="${todayRecord != null and todayRecord.checkInTime != null} ? 'disabled' : ''">
              📥 上班打卡
            </button>
          </form>
          <p class="text-muted mt-2">
            状态：
            <span th:if="${todayRecord != null and todayRecord.checkInTime != null}" class="text-success">✅ 已打卡</span>
            <span th:if="${todayRecord == null or todayRecord.checkInTime == null}" class="text-warning">⏳ 未打卡</span>
          </p>
        </div>
        <div class="col-6">
          <form th:action="@{/checkout}" method="post">
            <button type="submit" class="btn btn-checkout w-100" th:classappend="${todayRecord == null or todayRecord.checkInTime == null or todayRecord.checkOutTime != null} ? 'disabled' : ''">
              📤 下班打卡
            </button>
          </form>
          <p class="text-muted mt-2">
            状态：
            <span th:if="${todayRecord != null and todayRecord.checkOutTime != null}" class="text-success">✅ 已打卡</span>
            <span th:if="${todayRecord == null or todayRecord.checkOutTime == null}" class="text-warning">⏳ 未打卡</span>
          </p>
        </div>
      </div>

      <div th:if="${todayRecord != null}" class="card info-card mt-4">
        <div class="card-header bg-info text-white">今日打卡详情</div>
        <div class="card-body">
          <table class="table table-bordered">
            <tr><th>签到时间</th><td th:text="${todayRecord.checkInTime != null ? todayRecord.checkInTime : '未签到'}">?<\/td><th>状态</th>
              <td><span th:if="${todayRecord.status == 'ON_TIME'}" class="badge bg-success">准时</span>
                <span th:if="${todayRecord.status == 'LATE'}" class="badge bg-danger">迟到 <span th:text="${todayRecord.lateMinutes}"></span> 分钟</span>
                <span th:if="${todayRecord.status == 'ABSENT'}" class="badge bg-secondary">缺勤</span>
                <span th:if="${todayRecord.status == 'LEAVE'}" class="badge bg-info">请假</span><\/td><th>迟到分钟</th><td th:text="${todayRecord.lateMinutes != null && todayRecord.lateMinutes > 0 ? todayRecord.lateMinutes : '0'}">?<\/td></tr>
            <tr><th>签退时间</th><td th:text="${todayRecord.checkOutTime != null ? todayRecord.checkOutTime : '未签退'}">?<\/td><th>早退分钟</th><td th:text="${todayRecord.earlyLeaveMinutes != null && todayRecord.earlyLeaveMinutes > 0 ? todayRecord.earlyLeaveMinutes : '0'}">?<\/td></tr>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<script th:src="@{/webjars/jquery/3.7.1/jquery.min.js}"></script>
<script th:src="@{/webjars/bootstrap/5.3.2/js/bootstrap.bundle.min.js}"></script>
<script>
  function updateTime() {
    var now = new Date();
    var timeStr = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0') + ':' + String(now.getSeconds()).padStart(2, '0');
    document.getElementById('currentTime').innerHTML = timeStr;
  }
  updateTime();
  setInterval(updateTime, 1000);
</script>
</body>
</html>
