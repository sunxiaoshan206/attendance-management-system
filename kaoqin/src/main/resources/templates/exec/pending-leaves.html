<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>待审批请假 - 主管</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.2/css/bootstrap.min.css}">
</head>
<body>
<div class="container mt-4">
    <h2>待审批请假申请</h2>
    <div th:if="${session.user.role == 'EXEC'}" class="alert alert-info">
        您只能审批本部门（<span th:text="${session.user.department}"></span>）员工的请假申请
    </div>
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div th:if="${pendingLeaves != null and pendingLeaves.size() > 0}">
        <table class="table table-bordered">
            <thead>
            <tr><th>申请人</th><th>部门</th><th>类型</th><th>开始日期</th><th>结束日期</th><th>原因</th><th>操作</th></tr>
            </thead>
            <tbody>
            <tr th:each="leave : ${pendingLeaves}">
                <td th:text="${leave.user.realName}">?<\/td>
                <td th:text="${leave.user.department}">?<\/td>
                <td th:text="${leave.type}">?<\/td>
                <td th:text="${leave.startDate}">?<\/td>
                <td th:text="${leave.endDate}">?<\/td>
                <td th:text="${leave.reason}">?<\/td>
                <td>
                    <form th:action="@{/exec/approve/{id}(id=${leave.id})}" method="post" style="display:inline-block">
                        <input type="text" name="comment" placeholder="审批意见" class="form-control-sm mb-1" style="width:120px">
                        <button class="btn btn-success btn-sm">通过</button>
                    </form>
                    <form th:action="@{/exec/reject/{id}(id=${leave.id})}" method="post" style="display:inline-block">
                        <input type="text" name="comment" placeholder="拒绝理由" class="form-control-sm mb-1" style="width:120px">
                        <button class="btn btn-danger btn-sm">拒绝</button>
                    </form>
                    <\/td>
            </tr>
            </tbody>
        </table>
    </div>
    <div th:if="${pendingLeaves == null or pendingLeaves.size() == 0}" class="alert alert-info">
        暂无待审批的请假申请
    </div>
    <a href="/attendance/dashboard" class="btn btn-secondary">返回</a>
</div>
</body>
</html>
