<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>部门考勤 - 主管</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.2/css/bootstrap.min.css}">
    <style>
        .status-on-time { background-color: #d4edda; color: #155724; padding: 3px 8px; border-radius: 15px; font-size: 12px; }
        .status-late { background-color: #f8d7da; color: #721c24; padding: 3px 8px; border-radius: 15px; font-size: 12px; }
        .status-early-leave { background-color: #fff3cd; color: #856404; padding: 3px 8px; border-radius: 15px; font-size: 12px; }
        .status-absent { background-color: #e2e3e5; color: #383d41; padding: 3px 8px; border-radius: 15px; font-size: 12px; }
        .status-leave { background-color: #cce5ff; color: #004085; padding: 3px 8px; border-radius: 15px; font-size: 12px; }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-warning">
    <div class="container">
        <a class="navbar-brand" href="/attendance/dashboard">🏢 考勤管理系统</a>
        <div class="navbar-nav ms-auto">
            <span class="nav-link text-white">主管：<span th:text="${session.user.realName}"></span></span>
            <span class="nav-link text-white">部门：<span th:text="${session.user.department}"></span></span>
            <a class="nav-link text-white" href="/attendance/dashboard">🏠 返回首页</a>
            <a class="nav-link text-white" href="/attendance/logout">🚪 退出登录</a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div class="card">
        <div class="card-header bg-warning text-dark">
            <h4 class="mb-0">👥 部门考勤记录 - <span th:text="${departmentName}"></span></h4>
        </div>
        <div class="card-body">
            <form method="get" class="row g-3 mb-4 p-3 bg-light rounded">
                <div class="col-md-4">
                    <label class="form-label">员工姓名</label>
                    <input type="text" name="username" class="form-control" th:value="${selectedUsername}" placeholder="请输入姓名">
                </div>
                <div class="col-md-3">
                    <label class="form-label">开始日期</label>
                    <input type="date" name="startDate" class="form-control" th:value="${startDate}">
                </div>
                <div class="col-md-3">
                    <label class="form-label">结束日期</label>
                    <input type="date" name="endDate" class="form-control" th:value="${endDate}">
                </div>
                <div class="col-md-2 d-flex align-items-end">
                    <button type="submit" class="btn btn-warning w-100">🔍 查询</button>
                </div>
            </form>

            <div th:if="${records != null and records.size() > 0}">
                <table class="table table-bordered table-hover">
                    <thead class="table-secondary">
                    <tr>
                        <th>姓名</th>
                        <th>日期</th>
                        <th>签到时间</th>
                        <th>签退时间</th>
                        <th>状态</th>
                        <th>迟到(分钟)</th>
                        <th>早退(分钟)</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="r : ${records}">
                        <td th:text="${r.user.realName}"></td>
                        <td th:text="${r.date}"></td>
                        <td th:text="${r.checkInTime != null ? r.checkInTime : '未打卡'}"></td>
                        <td th:text="${r.checkOutTime != null ? r.checkOutTime : '未打卡'}"></td>
                        <td>
                            <span th:if="${r.status == 'ON_TIME'}" class="status-on-time">准时</span>
                            <span th:if="${r.status == 'LATE'}" class="status-late">迟到</span>
                            <span th:if="${r.status == 'EARLY_LEAVE'}" class="status-early-leave">早退</span>
                            <span th:if="${r.status == 'ABSENT'}" class="status-absent">缺勤</span>
                            <span th:if="${r.status == 'LEAVE'}" class="status-leave">请假</span>
                            <\/td>
                        <td th:text="${r.lateMinutes != null && r.lateMinutes > 0 ? r.lateMinutes : '-'}"></td>
                        <td th:text="${r.earlyLeaveMinutes != null && r.earlyLeaveMinutes > 0 ? r.earlyLeaveMinutes : '-'}"></td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <div th:if="${records == null or records.size() == 0}" class="alert alert-info text-center">
                📭 暂无考勤记录
            </div>
        </div>
    </div>
    <div class="mt-3 text-center"><a href="/attendance/dashboard" class="btn btn-secondary">← 返回首页</a></div>
</div>
</body>
</html>
