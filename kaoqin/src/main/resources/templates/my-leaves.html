<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>我的请假记录</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.2/css/bootstrap.min.css}">
</head>
<body>
<div class="container mt-4">
    <h2>我的请假记录</h2>
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
    <div th:if="${leaves != null and leaves.size() > 0}">
        <table class="table table-bordered">
            <thead><tr><th>申请日期</th><th>类型</th><th>开始日期</th><th>结束日期</th><th>原因</th><th>状态</th><th>审批意见</th></tr></thead>
            <tbody>
            <tr th:each="leave : ${leaves}">
                <td th:text="${leave.applyTime}">?<\/td>
                <td th:text="${leave.type}">?<\/td>
                <td th:text="${leave.startDate}">?<\/td>
                <td th:text="${leave.endDate}">?<\/td>
                <td th:text="${leave.reason}">?<\/td>
                <td>
                    <span th:if="${leave.status == 'PENDING'}" class="badge bg-warning">待审批</span>
                    <span th:if="${leave.status == 'APPROVED'}" class="badge bg-success">已批准</span>
                    <span th:if="${leave.status == 'REJECTED'}" class="badge bg-danger">已拒绝</span>
                    <\/td>
                <td th:text="${leave.managerComment}">?<\/td>
            </tr>
            </tbody>
        </table>
    </div>
    <div th:if="${leaves == null or leaves.size() == 0}" class="alert alert-info">暂无请假记录，点击<a href="/attendance/leave/apply">这里</a>申请请假</div>
    <a href="/attendance/dashboard" class="btn btn-secondary">返回</a>
</div>
</body>
</html>
