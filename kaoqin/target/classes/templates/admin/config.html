<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>系统配置 - 管理员</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.2/css/bootstrap.min.css}">
</head>
<body>
<div class="container mt-4">
    <h2>系统配置</h2>
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
    <form method="post" class="card p-4">
        <div class="mb-3">
            <label>上班时间 (HH:mm:ss)</label>
            <input type="time" name="workStartTime" step="1" th:value="${startTime}" class="form-control" required>
        </div>
        <div class="mb-3">
            <label>下班时间 (HH:mm:ss)</label>
            <input type="time" name="workEndTime" step="1" th:value="${endTime}" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary">保存配置</button>
        <a href="/attendance/dashboard" class="btn btn-secondary mt-3 d-inline-block ms-2">返回</a>
    </form>
</div>
</body>
</html>
