<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>请假管理 - 管理员/经理</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.2/css/bootstrap.min.css}">
    <style>
        .status-pending { background-color: #ffc107; color: #000; padding: 3px 8px; border-radius: 15px; font-size: 12px; }
        .status-approved { background-color: #28a745; color: #fff; padding: 3px 8px; border-radius: 15px; font-size: 12px; }
        .status-rejected { background-color: #dc3545; color: #fff; padding: 3px 8px; border-radius: 15px; font-size: 12px; }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-danger">
    <div class="container">
        <a class="navbar-brand" href="/attendance/dashboard">🏢 考勤管理系统</a>
        <div class="navbar-nav ms-auto">
            <span class="nav-link text-white" th:text="${session.user.role == 'MANAGER'} ? '经理：' : '管理员：' + ${session.user.realName}"></span>
            <a class="nav-link text-white" href="/attendance/dashboard">🏠 返回首页</a>
            <a class="nav-link text-white" href="/attendance/logout">🚪 退出登录</a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div class="card">
        <div class="card-header bg-danger text-white">
            <h4 class="mb-0">📋 请假申请管理</h4>
        </div>
        <div class="card-body">
            <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

            <div th:if="${leaves != null and leaves.size() > 0}">
                <table class="table table-bordered table-hover">
                    <thead class="table-secondary">
                    <tr>
                        <th>申请人</th>
                        <th>部门</th>
                        <th>类型</th>
                        <th>开始日期</th>
                        <th>结束日期</th>
                        <th>原因</th>
                        <th>状态</th>
                        <th>审批意见</th>
                        <th>操作</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="leave : ${leaves}">
                        <td th:text="${leave.user.realName}">?<\/td>
                        <td th:text="${leave.user.department != null ? leave.user.department : '无'}">?<\/td>
                        <td th:text="${leave.type}">?<\/td>
                        <td th:text="${leave.startDate}">?<\/td>
                        <td th:text="${leave.endDate}">?<\/td>
                        <td th:text="${leave.reason}">?<\/td>
                        <td>
                            <span th:if="${leave.status == 'PENDING'}" class="status-pending">待审批</span>
                            <span th:if="${leave.status == 'APPROVED'}" class="status-approved">已批准</span>
                            <span th:if="${leave.status == 'REJECTED'}" class="status-rejected">已拒绝</span>
                            <\/td>
                        <td th:text="${leave.managerComment != null ? leave.managerComment : '-'}">?<\/td>
                        <td>
                            <div th:if="${leave.status == 'PENDING'}">
                                <form th:action="@{/admin/approve-leave/{id}(id=${leave.id})}" method="post" style="display:inline-block">
                                    <input type="text" name="comment" placeholder="审批意见" class="form-control-sm mb-1" style="width:100px">
                                    <button class="btn btn-success btn-sm">通过</button>
                                </form>
                                <form th:action="@{/admin/reject-leave/{id}(id=${leave.id})}" method="post" style="display:inline-block">
                                    <input type="text" name="comment" placeholder="拒绝理由" class="form-control-sm mb-1" style="width:100px">
                                    <button class="btn btn-danger btn-sm">拒绝</button>
                                </form>
                            </div>
                            <span th:if="${leave.status != 'PENDING'}" class="text-muted">-</span>
                            <\/td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <div th:if="${leaves == null or leaves.size() == 0}" class="alert alert-info text-center">
                📭 暂无请假申请
            </div>
        </div>
    </div>
    <div class="mt-3 text-center"><a href="/attendance/dashboard" class="btn btn-secondary">← 返回首页</a></div>
</div>
</body>
</html>
