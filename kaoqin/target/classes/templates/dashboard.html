<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>首页 - 考勤管理系统</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.2/css/bootstrap.min.css}">
    <style>
        .card-dashboard { transition: transform 0.3s; cursor: pointer; }
        .card-dashboard:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        .navbar-brand { font-weight: bold; }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="#">🏢 考勤管理系统</a>
        <div class="navbar-nav ms-auto">
            <span class="nav-link text-white">欢迎，<span th:text="${session.user.realName}"></span></span>
            <span class="nav-link text-white">角色：
                    <span th:if="${session.user.role == 'EMPLOYEE'}" class="badge bg-info">员工</span>
                    <span th:if="${session.user.role == 'EXEC'}" class="badge bg-warning">主管</span>
                    <span th:if="${session.user.role == 'MANAGER'}" class="badge bg-success">经理</span>
                    <span th:if="${session.user.role == 'ADMIN'}" class="badge bg-danger">管理员</span>
                </span>
            <a class="nav-link text-white" href="/attendance/logout">🚪 退出登录</a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div class="row mb-4">
        <div class="col-md-12">
            <div class="alert alert-info">
                <strong>🏢 部门：</strong> <span th:text="${session.user.department != null ? session.user.department : '无'}"></span>
                <strong class="ms-4">📅 今天是：</strong> <span th:text="${#dates.format(#dates.createNow(), 'yyyy年MM月dd日 EEEE')}"></span>
                <strong class="ms-4">🕐 当前时间：</strong> <span th:text="${#dates.format(#dates.createNow(), 'HH:mm:ss')}"></span>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col-md-3 mb-3">
            <div class="card card-dashboard" onclick="location.href='/attendance/attendance'">
                <div class="card-body text-center">
                    <div style="font-size: 48px;">📱</div>
                    <h5 class="card-title">打卡考勤</h5>
                    <p class="card-text text-muted">点击进行上班/下班打卡</p>
                </div>
            </div>
        </div>
        <div class="col-md-3 mb-3">
            <div class="card card-dashboard" onclick="location.href='/attendance/leave/apply'">
                <div class="card-body text-center">
                    <div style="font-size: 48px;">📝</div>
                    <h5 class="card-title">请假申请</h5>
                    <p class="card-text text-muted">在线填写请假申请单</p>
                </div>
            </div>
        </div>
        <div class="col-md-3 mb-3">
            <div class="card card-dashboard" onclick="location.href='/attendance/my-attendance'">
                <div class="card-body text-center">
                    <div style="font-size: 48px;">📊</div>
                    <h5 class="card-title">我的考勤</h5>
                    <p class="card-text text-muted">查看个人考勤记录</p>
                </div>
            </div>
        </div>
        <div class="col-md-3 mb-3">
            <div class="card card-dashboard" onclick="location.href='/attendance/my-leaves'">
                <div class="card-body text-center">
                    <div style="font-size: 48px;">📋</div>
                    <h5 class="card-title">我的请假</h5>
                    <p class="card-text text-muted">查看请假申请记录</p>
                </div>
            </div>
        </div>
    </div>

    <div th:if="${session.user.role == 'EXEC'}" class="row mt-3">
        <div class="col-12">
            <div class="card">
                <div class="card-header bg-warning text-dark">
                    <strong>👔 主管功能</strong>
                </div>
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-4 mb-2">
                            <a href="/attendance/exec/pending-leaves" class="btn btn-outline-warning w-100">📋 待审批请假</a>
                        </div>
                        <div class="col-md-4 mb-2">
                            <a href="/attendance/exec/team-attendance" class="btn btn-outline-warning w-100">👥 部门考勤</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:if="${session.user.role == 'MANAGER'}" class="row mt-3">
        <div class="col-12">
            <div class="card">
                <div class="card-header bg-success text-white">
                    <strong>🏢 经理功能</strong>
                </div>
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-4 mb-2">
                            <a href="/attendance/manager/all-attendance" class="btn btn-outline-success w-100">📊 全公司考勤</a>
                            <div class="col-md-4 mb-2">
                                <a href="/attendance/admin/leave-requests" class="btn btn-outline-success w-100">
                                    📋 请假审批
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:if="${session.user.role == 'ADMIN'}" class="row mt-3">
        <div class="col-12">
            <div class="card">
                <div class="card-header bg-danger text-white">
                    <strong>🔧 管理员功能</strong>
                </div>
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-3 mb-2">
                            <a href="/attendance/admin/pending-users" class="btn btn-outline-danger w-100">👤 审核用户</a>
                        </div>
                        <div class="col-md-3 mb-2">
                            <a href="/attendance/admin/attendance-report" class="btn btn-outline-danger w-100">📈 考勤报表</a>
                        </div>
                        <div class="col-md-3 mb-2">
                            <a href="/attendance/admin/config" class="btn btn-outline-danger w-100">⚙️ 系统配置</a>
                        </div>
                        <div class="col-md-3 mb-2">
                            <a href="/attendance/admin/leave-requests" class="btn btn-outline-danger w-100">📋 请假管理</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="row mt-4">
        <div class="col-12">
            <div class="card">
                <div class="card-header bg-success text-white">今日打卡状态</div>
                <div class="card-body">
                    <div th:if="${todayRecord == null}" class="text-center text-muted">今日尚未打卡，请点击上方打卡按钮</div>
                    <div th:if="${todayRecord != null}" class="row text-center">
                        <div class="col-6">
                            <strong>签到时间：</strong><br>
                            <span th:if="${todayRecord.checkInTime != null}" th:text="${todayRecord.checkInTime}" class="fs-4"></span>
                            <span th:if="${todayRecord.checkInTime == null}" class="text-muted">未签到</span>
                            <br>
                            <span th:if="${todayRecord.status == 'LATE'}" class="badge bg-danger">迟到</span>
                            <span th:if="${todayRecord.status == 'ON_TIME'}" class="badge bg-success">准时</span>
                        </div>
                        <div class="col-6">
                            <strong>签退时间：</strong><br>
                            <span th:if="${todayRecord.checkOutTime != null}" th:text="${todayRecord.checkOutTime}" class="fs-4"></span>
                            <span th:if="${todayRecord.checkOutTime == null}" class="text-muted">未签退</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script th:src="@{/webjars/jquery/3.7.1/jquery.min.js}"></script>
<script th:src="@{/webjars/bootstrap/5.3.2/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
